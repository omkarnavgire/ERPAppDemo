<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" routerLink="/dashboard">AppPortal</a>
    
    <div class="collapse navbar-collapse d-flex justify-content-between" id="navbarNav">
      <!-- Main Routing Menus -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active">Overview</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard/profile" routerLinkActive="active">Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard/settings" routerLinkActive="active">Settings</a>
        </li>
      </ul>
      
      <!-- Quick Actions / User Logout -->
      <div class="d-flex align-items-center">
        <span class="text-light me-3 small">Welcome, User!</span>
        <button (click)="logout()" class="btn btn-outline-danger btn-sm px-3" type="button">
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- Content Area where sub-menus render -->
<div class="container">
  <router-outlet></router-outlet>
</div>
