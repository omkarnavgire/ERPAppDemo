<!-- login.component.html -->
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4 p-sm-5">
        <h3 class="text-center fw-bold mb-4 text-primary">Welcome Back</h3>
        
        <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="onLogin()">
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" [(ngModel)]="email" name="email" required />
            <label for="emailInput">Email address</label>
          </div>
          
          <div class="form-floating mb-4">
            <input type="password" class="form-control" id="passwordInput" placeholder="Password" [(ngModel)]="password" name="password" required />
            <label for="passwordInput">Password</label>
          </div>

          <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
