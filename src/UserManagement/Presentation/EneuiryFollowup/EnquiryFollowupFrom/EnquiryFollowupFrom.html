<div class="enquiry-form-page">
  <a class="back-link" routerLink="/main/enquiry">All Enquiries</a>
  <div class="form-card">
    <div class="form-title">
      <h1>Enquiry Form</h1>
    </div>
    <form [formGroup]="enquiryForm" (ngSubmit)="submit()">
      <div class="form-layout">
        <div class="left-section">
          <div class="form-group">
            <label>Enquiry Date:</label>
            <input type="date" formControlName="enquiryDate">
          </div>
          <div class="form-group">
            <label>Branch Name:</label>
            <select formControlName="branchId">
              <option value="">Select Branch</option>
              <option *ngFor="let branch of branches" [value]="branch.id">
                {{ branch.name }}
              </option>
            </select>
          </div>
          <div class="form-group">
            <label>Candidate Name:</label>
            <input type="text" formControlName="candidateName" placeholder="Enter candidate name">
          </div>
          <div class="form-group gender-group">
            <label>Gender:</label>
            <label class="radio-label">
              <input type="radio" value="Male" formControlName="gender">
              Male
            </label>
            <label class="radio-label">
              <input type="radio" value="Female" formControlName="gender">
              Female
            </label>
          </div>
          <div class="form-group">
            <label>Local Address:</label>
            <input type="text" formControlName="localAddress">
          </div>
          <div class="form-group">
            <label>Email Address:</label>
            <input type="email" formControlName="emailAddress">
          </div>
          <div class="form-group">
            <label>Mobile Number:</label>
            <input type="text" maxlength="10" formControlName="mobileNumber">
          </div>
          <div class="form-group">
            <label>Birth Date:</label>
            <input type="date" formControlName="birthDate">
          </div>
          <div class="form-group">
            <label>Qualification:</label>
            <select formControlName="qualification">
              <option value="">Select Qualification</option>
              <option *ngFor="let qualification of qualifications" [value]="qualification">
                {{ qualification }}
              </option>
            </select>
          </div>
        </div>
        <div class="right-section">
          <div class="check-card">
            <div class="check-title">Enquiry For</div>
            <div class="check-grid">
              <label *ngFor="let item of enquiryForOptions">
                <input type="checkbox" [checked]="isSelected('enquiryFor', item)"
                  (change)="toggleSelection('enquiryFor', item)">
                {{ item }}
              </label>
            </div>
          </div>
          <div class="check-card">
            <div class="check-title">How did you come to know about us?</div>
            <div class="check-grid">
              <label *ngFor="let item of leadSourceOptions">
                <input type="checkbox" [checked]="isSelected('leadSource', item)"
                  (change)="toggleSelection('leadSource', item)">
                {{ item }}
              </label>
            </div>
          </div>
          <div class="check-card topics-card">
            <div class="check-title">Tick your Interesting Training</div>
            <div class="topics-scroll">
              <div class="check-grid four-columns">
                <label *ngFor="let item of courses">
                  <input type="checkbox" [checked]="isSelected('interestedTopics', item.name)"
                    (change)="toggleSelection('interestedTopics', item.name)">
                  {{ item.name }}
                </label>
              </div>
            </div>
          </div>
          <button class="submit-btn" type="submit" [disabled]="enquiryForm.invalid">
            {{ isEditMode ? 'Update' : 'Submit' }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
