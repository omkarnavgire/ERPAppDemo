<!-- Header -->
<nav class="navbar navbar-expand-lg ciit-navbar">
    <div class="container-fluid">

        <!-- CIIT Brand -->
        <a class="navbar-brand ciit-brand" routerLink="/main/dashboard">
            <div class="ciit-brand-name">
                <span class="ciit-title">CIIT</span>
                <span class="ciit-logo-sub">Training Institute</span>
            </div>
        </a>

        <!-- Header Actions -->
        <div class="navbar-nav ms-auto ciit-nav-right">
            <button type="button" class="theme-toggle" (click)="toggleTheme()"
                    [attr.aria-label]="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                    [title]="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'">
                <i class="bi" [ngClass]="isDarkTheme ? 'bi-moon-stars-fill' : 'bi-sun-fill'"></i>
                <span>{{ isDarkTheme ? 'Dark' : 'Light' }}</span>
                <span class="theme-switch-track" [class.is-dark]="isDarkTheme"><span></span></span>
            </button>

            <div class="profile-menu-wrap">
                <button type="button" class="profile-menu-trigger" (click)="toggleProfileMenu()"
                        [attr.aria-expanded]="showProfileMenu">
                    <span class="top-profile-avatar"><i class="bi bi-person-fill"></i></span>
                    <span class="top-profile-name">{{ employeeName || 'User' }}</span>
                    <i class="bi bi-chevron-down profile-chevron"></i>
                </button>
                <div class="profile-dropdown" *ngIf="showProfileMenu">
                    <button type="button" (click)="goToProfile()"><i class="bi bi-person-circle"></i> Profile</button>
                    <button type="button" (click)="goToChangePassword()"><i class="bi bi-lock"></i> Change Password</button>
                    <div class="profile-dropdown-divider"></div>
                    <button type="button" class="dropdown-logout" (click)="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </div>
            </div>
        </div>

    </div>
</nav>

<!-- Main Page -->
<div class="ciit-page">
    <div class="row g-3">

        <!-- Sidebar -->
        <div class="col-lg-2 col-md-3">
            <div class="ciit-sidebar">


                <!-- Professional User Profile -->
                <div class="sidebar-user-profile">
                    <div class="profile-avatar">
                        <i class="bi bi-person-fill"></i>
                    </div>

                    <div class="profile-info">
                        <!-- <div class="profile-name" [title]="employeeName">
                            {{ employeeName || 'User' }}
                        </div> -->

                        <div class="profile-role">
                            <i class="bi bi-shield-check"></i>
                            <span>{{ roleName || 'User' }}</span>
                        </div>
                    </div>
                </div>


                <!-- Sidebar Heading -->
                <!-- <div class="ciit-sidebar-header">
                    <div class="sidebar-heading">
                        <i class="bi bi-grid me-2"></i>
                        NAVIGATION
                    </div>
                    <small>Institute Management</small>
                </div> -->

                <!-- Navigation Menu -->
                <ul class="list-group ciit-sidebar-list">
                    @for (menu of visibleMenus; track menu.route) {
                    <li class="list-group-item">
                        <a [routerLink]="menu.route" routerLinkActive="active-link">

                            <span class="ciit-sidebar-icon">
                                {{ menu.icon }}
                            </span>

                            <span class="ciit-menu-label">
                                {{ menu.label }}
                            </span>
                        </a>
                    </li>
                    }
                </ul>

            </div>
        </div>

        <!-- Page Content -->
        <div class="col-lg-10 col-md-9">
            <div class="ciit-content">
                <router-outlet></router-outlet>
            </div>
        </div>

    </div>
</div>
